<!doctype html>
<html lang="de" class="home-open">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1036" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SquishDoku" />
  <title>SquishDoku</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="preload" as="font" type="font/ttf" href="vendor/squish-attack/game/assets/fonts/LilitaOne-Regular.ttf" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="vendor/squish-attack/game/assets/fonts/fredoka.woff2" crossorigin />
  <link rel="stylesheet" href="vendor/squish-attack/game/autumn-ui.css" />
  <link rel="stylesheet" href="vendor/squish-attack/game/ads.css" />
  <link rel="stylesheet" href="vendor/squish-attack/game/comic-ui.css" />
  <link rel="stylesheet" href="src/style.css?v=nn1" />
  <link rel="stylesheet" href="src/neon.css?v=nn1" />
  <link rel="preload" as="image" href="src/img/hero-board.webp" />
</head>
<body class="aw">

  <!-- Menüs im Neon-Nacht-Design: Start / Levels / Statistik / Regeln (+ Einstellungen als Sheet) -->
  <div class="nn-menu" id="home" data-screen="home">
    <div class="nn-view" id="home-screen"></div>
    <nav class="nn-tabs nn-glass" id="tabs" aria-label="Navigation">
      <button type="button" data-tab="home" id="tab-home"><i></i><span>Start</span></button>
      <button type="button" data-tab="levels" id="btn-levels"><i></i><span>Levels</span></button>
      <button type="button" data-tab="stats" id="tab-stats"><i></i><span>Statistik</span></button>
      <button type="button" data-tab="settings" id="tab-settings"><i></i><span>Optionen</span></button>
    </nav>
  </div>

  <!-- Einstellungen (Bottom-Sheet) -->
  <div class="nn-sheet-veil" id="sheet-veil" hidden>
    <section class="nn-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="nn-grab" aria-hidden="true"></div>
      <h2 id="sheet-title">Einstellungen<button type="button" class="nn-x" id="sheet-close" aria-label="Schließen"></button></h2>
      <div class="nn-chips3" id="sheet-stats"></div>
      <div class="nn-grp">
        <button type="button" class="nn-row" id="sound-toggle" aria-pressed="true"><span class="nn-ic" style="--c:#7fc0ff;--b:#3a8de033"></span><span class="nn-row-t">Ton</span><span class="nn-tg" aria-hidden="true"></span></button>
        <button type="button" class="nn-row" id="vibe-toggle" aria-pressed="true" hidden><span class="nn-ic" style="--c:#c9a3ff;--b:#a35cf033"></span><span class="nn-row-t">Vibration</span><span class="nn-tg" aria-hidden="true"></span></button>
        <button type="button" class="nn-row" id="time-toggle" aria-pressed="true"><span class="nn-ic" style="--c:#8ee86a;--b:#38b81c33"></span><span class="nn-row-t">Zeit anzeigen</span><span class="nn-tg" aria-hidden="true"></span></button>
      </div>
      <div class="nn-grp">
        <button type="button" class="nn-row" id="btn-rules"><span class="nn-ic" style="--c:#ffcf5a;--b:#ffcf5a26"></span><span class="nn-row-t">Regeln &amp; Tipps</span><small aria-hidden="true">›</small></button>
        <button type="button" class="nn-row" id="btn-share"><span class="nn-ic" style="--c:#cfd5ff;--b:#ffffff14"></span><span class="nn-row-t">Freunde einladen</span><small aria-hidden="true">›</small></button>
        <button type="button" class="nn-row is-danger" id="btn-wipe"><span class="nn-ic" style="--c:#ff7a8a;--b:#ff5a6e22"></span><span class="nn-row-t">Fortschritt zurücksetzen</span></button>
      </div>
    </section>
  </div>
  <div class="nn-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Spielbildschirm -->
  <main class="sd-game" id="game" hidden>
    <div class="sd-stage" id="stage">
      
      <div class="sd-host" id="host"></div>
      <div class="board-slot" id="slot"></div>
      <header class="sd-hud">
        <button class="sd-round" id="btn-back" type="button" aria-label="Zurück zum Menü"></button>
        <div class="sd-level" id="level-card"><span class="sd-level-kicker"><span id="lvl-kind">LEVEL</span> <b id="lvl-num">1</b></span><span class="sd-level-name" id="lvl-name">Sehr leicht</span></div>
        <button class="sd-round sd-undo" id="btn-undo" type="button" aria-label="Rückgängig" disabled></button>
        <button class="sd-round" id="btn-reset" type="button" aria-label="Level neu starten"></button>
      </header>
      <div class="sd-status">
        <div class="sd-hearts" id="hearts" aria-label="3 Herzen"></div>
        <div class="sd-timer" id="timer" role="timer" aria-label="Zeit"><i aria-hidden="true"></i><span id="timer-text">0:00</span></div>
        <div class="sd-progress" id="progress"><i class="sd-mini-glow"></i><b id="glow-count">0</b>/<span id="glow-total">5</span></div>
      </div>
      <div class="sd-rulesbar" id="rulesbar" aria-label="Regeln"></div>
      <button class="sd-adtip" id="btn-adtip" type="button" aria-label="Tipp per Werbung: ein richtiger Squish leuchtet auf"></button>
      <p class="sd-hint" id="hint"></p>
      <div class="sd-fx" id="fx" aria-hidden="true"></div>
    </div>
  </main>

  <!-- Dialoge -->
  <div class="sd-veil" id="veil" hidden>
    <div class="sd-dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <script src="src/config.js"></script>
  <script src="src/tutorial.js"></script>
  <script src="src/daily.js"></script>
  <script type="module" src="src/main.mjs?v=nn1"></script>
</body>
</html>
